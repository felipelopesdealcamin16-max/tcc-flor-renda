<body>

<header>

</header>

<nav>

        <li><a href="index.html">Início</a></li>

<main>

    <section>

        <h2>Contato</h2>

        <article>
            <h3>Fale Conosco</h3>

            <p>
                Telefone:
                <a href="tel:+5517999999999">
                    (17) 99999-9999
                </a>
            </p>

            <p>
                E-mail:
                <a href="mailto:contato@florerenda.com">
                    contato@florerenda.com
                </a>
            </p>

            <p>
                Localização: Barretos - SP
            </p>
        </article>

        <article>

            <h3>Envie uma mensagem</h3>

            <form id="formContato">

                <label for="nome">Nome:</label>
                <br>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <br><br>

                <label for="email">E-mail:</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <label for="mensagem">Mensagem:</label>
                <br>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="6"
                    required>
                </textarea>

                <br><br>

                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </article>

    </section>

</main>
